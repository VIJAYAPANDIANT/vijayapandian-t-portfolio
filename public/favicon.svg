<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 135 deg Diagonal Gradient for Outer Ring -->
    <linearGradient id="ring-gradient" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="35%" stop-color="#236eff" />
      <stop offset="68%" stop-color="#aa28f5" />
      <stop offset="100%" stop-color="#ff00a5" />
    </linearGradient>

    <!-- Horizontal Gradient for VJ Monogram -->
    <linearGradient id="text-gradient" x1="20%" y1="50%" x2="80%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="68%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#ff00a5" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="ring-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14" result="glow1" />
      <feGaussianBlur stdDeviation="5" result="glow2" />
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="glow2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Neon Aura Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ring-gradient)" stroke-width="16" opacity="0.65" filter="url(#ring-glow)" />

  <!-- Base Black Emblem Circle with Crisp Gradient Border -->
  <circle cx="256" cy="256" r="223" fill="#000000" stroke="url(#ring-gradient)" stroke-width="15" />

  <!-- Solid Pitch Black Interior -->
  <circle cx="256" cy="256" r="215" fill="#000000" />

  <!-- Bold Glowing VJ Monogram -->
  <text 
    x="256" 
    y="332" 
    font-family="'Segoe UI Black', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif" 
    font-weight="900" 
    font-size="252" 
    fill="url(#text-gradient)" 
    text-anchor="middle" 
    filter="url(#text-glow)"
    letter-spacing="-3"
  >VJ</text>
  <text 
    x="256" 
    y="332" 
    font-family="'Segoe UI Black', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif" 
    font-weight="900" 
    font-size="252" 
    fill="url(#text-gradient)" 
    text-anchor="middle" 
    letter-spacing="-3"
  >VJ</text>
</svg>