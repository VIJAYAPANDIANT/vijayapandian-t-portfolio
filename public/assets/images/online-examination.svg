    <text x="10" y="62" fill="#64748b" font-family="sans-serif" font-size="7.5">Java, Python, JS, C, C++ Coding Sandbox</text>

    <rect x="0" y="72" width="195" height="32" rx="6" fill="#1f2937"/>
