  <rect x="220" y="106" width="52" height="20" rx="4" fill="#6366f1" opacity="0.3"/>
  <text x="246" y="120" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">45:20</text>

