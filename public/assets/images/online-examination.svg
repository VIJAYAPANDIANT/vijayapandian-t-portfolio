  <path d="M347 80 L358 84 V91 C358 97.5 353.5 103.5 347 105 C340.5 103.5 336 97.5 336 91 V84 Z" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <path d="M343 92 L346 95 L352 89" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="375" y="87" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">AI Examination Hub</text>
  <text x="375" y="101" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Proctored Assessment Suite</text>

