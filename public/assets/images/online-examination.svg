  <!-- Bottom subtitle -->
  <text x="300" y="335" fill="#94a3b8" font-family="sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Spring Boot • React • RabbitMQ • Docker • Redis • MySQL • AI Anti-Cheat</text>
