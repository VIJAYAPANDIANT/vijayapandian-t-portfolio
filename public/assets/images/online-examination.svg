    <rect x="0" y="108" width="195" height="32" rx="6" fill="#1f2937"/>
    <text x="10" y="123" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="600">🌐 Live Vercel &amp; Spring Boot</text>
