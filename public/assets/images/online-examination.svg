  <circle cx="268" cy="154" r="3" fill="#10b981"/>

  <text x="86" y="178" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold">public class</text>
  <text x="146" y="178" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8.5">Assessment {</text>

  <text x="96" y="194" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold">public int[]</text>
  <text x="156" y="194" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="8.5">solve()</text>
  <text x="195" y="194" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8.5">{</text>

  <text x="106" y="210" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8.5">// RabbitMQ submission</text>
  <text x="106" y="226" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="8.5">return new int</text>
  <text x="180" y="226" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8.5">[]{ 1, 0 };</text>

  <text x="86" y="240" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8.5">}</text>

