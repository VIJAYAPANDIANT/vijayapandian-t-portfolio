  <rect x="214" y="258" width="65" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="246.5" y="272" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">Docker</text>

