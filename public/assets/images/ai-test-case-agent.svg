<svg width="600" height="360" viewBox="0 0 600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="360" rx="16" fill="#0c1220"/>
  <circle cx="300" cy="180" r="140" fill="url(#gemini-glow)" opacity="0.18"/>
  <defs>
    <radialGradient id="gemini-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 180) rotate(90) scale(140)">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.6" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="agent-badge" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Left: TestGen AI Prompt & Assertion Builder Window -->
  <rect x="60" y="55" width="235" height="250" rx="10" fill="#131d33" stroke="#253754" stroke-width="1.5"/>
  <rect x="60" y="55" width="235" height="32" rx="10" fill="#0f172a"/>
  <circle cx="80" cy="71" r="4.5" fill="#ef4444"/>
  <circle cx="95" cy="71" r="4.5" fill="#f59e0b"/>
  <circle cx="110" cy="71" r="4.5" fill="#10b981"/>
  <text x="132" y="75" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">testgen-agent.ai</text>

  <!-- Gemini AI Reasoning Status Bar -->
  <rect x="76" y="98" width="203" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="90" cy="116" r="4" fill="#38bdf8"/>
  <text x="100" y="115" fill="#38bdf8" font-family="sans-serif" font-size="9.5" font-weight="bold">Gemini 1.5 Flash Reasoning</text>
  <text x="100" y="126" fill="#94a3b8" font-family="sans-serif" font-size="7.5">Synthesizing Edge &amp; Security Tests</text>
  <rect x="220" y="106" width="52" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
  <text x="246" y="120" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">100% DONE</text>

  <!-- Generated Code Output Card (Jest / PyTest / Playwright) -->
  <rect x="76" y="144" width="203" height="102" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
  <rect x="76" y="144" width="203" height="20" rx="6" fill="#0f172a"/>
  <text x="86" y="158" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">auth.test.ts (Jest / Supertest)</text>
  <circle cx="268" cy="154" r="3" fill="#10b981"/>

  <text x="86" y="178" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold">describe</text>
  <text x="135" y="178" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8.5">('POST /register', () => {</text>

  <text x="96" y="194" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold">test</text>
  <text x="120" y="194" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="8.5">('enforces SQLi &amp; XSS safe',</text>

  <text x="106" y="210" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="8.5">expect</text>
  <text x="140" y="210" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8.5">(res.status).</text>
  <text x="200" y="210" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5">toBe(400);</text>

  <text x="96" y="226" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8.5">// Boundary check: empty body</text>
  <text x="86" y="240" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8.5">});</text>

  <!-- Tags under left window -->
  <rect x="76" y="258" width="60" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="106" y="272" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">Gemini AI</text>

  <rect x="142" y="258" width="66" height="20" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="0.8"/>
  <text x="175" y="272" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">Jest/PyTest</text>

  <rect x="214" y="258" width="65" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
  <text x="246.5" y="272" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">Export PDF</text>

  <!-- Right: Featured Agent Hub Card -->
  <rect x="310" y="55" width="230" height="250" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  
  <!-- AI Agent Sparkle / Rocket Logo Badge -->
  <rect x="328" y="72" width="38" height="38" rx="6" fill="url(#agent-badge)"/>
  <path d="M347 78 L350 85 L357 88 L350 91 L347 98 L344 91 L337 88 L344 85 Z" fill="#ffffff"/>
  <circle cx="355" cy="81" r="2" fill="#ffffff"/>

  <text x="375" y="87" fill="#f8fafc" font-family="sans-serif" font-size="12.5" font-weight="bold">TestGen AI Agent</text>
  <text x="375" y="101" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Autonomous Test Engineering</text>

  <!-- Feature Rows -->
  <g transform="translate(328, 118)">
    <rect x="0" y="0" width="195" height="32" rx="6" fill="#1f2937"/>
    <text x="10" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">🤖 Google Gemini 1.5 SDK</text>
    <text x="10" y="26" fill="#64748b" font-family="sans-serif" font-size="7.5">Automated Multi-Framework Assertion Generation</text>

    <rect x="0" y="36" width="195" height="32" rx="6" fill="#1f2937"/>
    <text x="10" y="51" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="600">🛡️ Vulnerability &amp; Boundary Scans</text>
    <text x="10" y="62" fill="#64748b" font-family="sans-serif" font-size="7.5">SQLi, XSS, Null Pointers &amp; Extreme Load Tests</text>

    <rect x="0" y="72" width="195" height="32" rx="6" fill="#1f2937"/>
    <text x="10" y="87" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">⚡ 0–99% Thinking Sequencer</text>
    <text x="10" y="98" fill="#64748b" font-family="sans-serif" font-size="7.5">Real-time progressive reasoning &amp; token streaming</text>

    <rect x="0" y="108" width="195" height="32" rx="6" fill="#1f2937"/>
    <text x="10" y="123" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="600">🌐 Live Vercel Full-Stack</text>
    <text x="10" y="134" fill="#64748b" font-family="sans-serif" font-size="7.5">Next.js 15 Client + Node.js Express Gateway</text>
  </g>

  <!-- Bottom subtitle -->
  <text x="300" y="335" fill="#94a3b8" font-family="sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Google Gemini API • Next.js 15 • React 19 • TypeScript • Express • Tailwind</text>
</svg>
