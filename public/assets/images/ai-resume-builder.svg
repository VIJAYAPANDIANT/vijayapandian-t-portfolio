<svg width="600" height="360" viewBox="0 0 600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="360" rx="16" fill="#0c1220"/>
  <circle cx="300" cy="180" r="140" fill="url(#emerald-glow)" opacity="0.16"/>
  <defs>
    <radialGradient id="emerald-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 180) rotate(90) scale(140)">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Left: Resume Document Preview -->
  <rect x="110" y="60" width="180" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="125" y="80" width="70" height="8" rx="4" fill="#38bdf8"/>
  <rect x="125" y="94" width="110" height="5" rx="2.5" fill="#64748b"/>
  <line x1="125" y1="110" x2="275" y2="110" stroke="#334155" stroke-width="1"/>
  
  <rect x="125" y="125" width="50" height="6" rx="3" fill="#94a3b8"/>
  <rect x="125" y="137" width="130" height="4" rx="2" fill="#475569"/>
  <rect x="125" y="146" width="140" height="4" rx="2" fill="#475569"/>
  <rect x="125" y="155" width="120" height="4" rx="2" fill="#475569"/>

  <rect x="125" y="175" width="60" height="6" rx="3" fill="#94a3b8"/>
  <rect x="125" y="187" width="145" height="4" rx="2" fill="#10b981" opacity="0.9"/>
  <rect x="125" y="196" width="135" height="4" rx="2" fill="#475569"/>
  <rect x="125" y="205" width="115" height="4" rx="2" fill="#475569"/>

  <rect x="125" y="225" width="55" height="6" rx="3" fill="#94a3b8"/>
  <rect x="125" y="237" width="140" height="4" rx="2" fill="#475569"/>
  <rect x="125" y="246" width="130" height="4" rx="2" fill="#475569"/>

  <!-- Right: AI Evaluation Panel -->
  <rect x="310" y="60" width="180" height="240" rx="8" fill="#131d33" stroke="#2a3f5f" stroke-width="1.5"/>
  <text x="325" y="85" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">ATS OPTIMIZER</text>
  
  <!-- ATS Score Circle -->
  <circle cx="400" cy="130" r="32" fill="none" stroke="#1e293b" stroke-width="6"/>
  <circle cx="400" cy="130" r="32" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="201" stroke-dashoffset="20"/>
  <text x="400" y="132" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">94</text>
  <text x="400" y="146" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">EXCELLENT</text>

  <!-- Suggestion pill -->
  <rect x="325" y="180" width="150" height="45" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="335" y="198" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold">AI Enhancer Applied</text>
  <text x="335" y="214" fill="#94a3b8" font-family="sans-serif" font-size="8">Keywords matched: +18</text>

  <!-- Export button -->
  <rect x="325" y="240" width="150" height="34" rx="6" fill="#0284c7"/>
  <text x="400" y="261" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Download ATS PDF</text>

  <text x="300" y="335" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">AI Resume Builder • Gemini Powered</text>
</svg>
