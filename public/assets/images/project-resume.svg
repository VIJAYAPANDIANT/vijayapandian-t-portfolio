<svg width="600" height="360" viewBox="0 0 600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="360" rx="16" fill="#0c1220"/>
  <circle cx="300" cy="180" r="150" fill="url(#gemini-glow)" opacity="0.2"/>
  
  <defs>
    <radialGradient id="gemini-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 180) rotate(90) scale(150)">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.6" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0c1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="score-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="btn-grad" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Browser container -->
  <rect x="40" y="45" width="520" height="270" rx="12" fill="#111a2e" stroke="#1e2e4a" stroke-width="1.5"/>
  <rect x="40" y="45" width="520" height="32" rx="12" fill="#0b1322"/>
  <circle cx="62" cy="61" r="4.5" fill="#ef4444"/>
  <circle cx="77" cy="61" r="4.5" fill="#f59e0b"/>
  <circle cx="92" cy="61" r="4.5" fill="#10b981"/>
  <rect x="115" y="52" width="230" height="18" rx="9" fill="#162238"/>
  <text x="130" y="65" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">smart-resume-builder-a1ej.vercel.app</text>
  <rect x="440" y="52" width="105" height="18" rx="9" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
  <text x="492" y="64" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Gemini 2.5 Flash</text>

  <!-- Left: Live Resume Document Preview -->
  <g transform="translate(60, 92)">
    <rect width="215" height="205" rx="8" fill="#182338" stroke="#253552" stroke-width="1"/>
    
    <!-- Header: Candidate Info -->
    <rect x="16" y="16" width="32" height="32" rx="16" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="32" y="36" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VJ</text>
    <rect x="56" y="18" width="90" height="10" rx="4" fill="#f1f5f9"/>
    <rect x="56" y="32" width="125" height="6" rx="3" fill="#64748b"/>
    <line x1="16" y1="56" x2="199" y2="56" stroke="#253552" stroke-width="1"/>

    <!-- Section 1: Experience -->
    <rect x="16" y="66" width="60" height="8" rx="3" fill="#38bdf8"/>
    <rect x="16" y="80" width="170" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="16" y="89" width="155" height="5" rx="2.5" fill="#475569"/>
    <rect x="16" y="98" width="165" height="5" rx="2.5" fill="#475569"/>

    <!-- Section 2: Projects & Skills -->
    <rect x="16" y="115" width="55" height="8" rx="3" fill="#10b981"/>
    <rect x="16" y="129" width="160" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="16" y="138" width="145" height="5" rx="2.5" fill="#475569"/>

    <!-- Section 3: Education & Certifications -->
    <rect x="16" y="155" width="65" height="8" rx="3" fill="#a855f7"/>
    <rect x="16" y="169" width="150" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="16" y="178" width="130" height="5" rx="2.5" fill="#475569"/>
  </g>

  <!-- Right: Gemini 2.5 Flash ATS Analysis Engine -->
  <g transform="translate(295, 92)">
    <rect width="245" height="205" rx="8" fill="#141e33" stroke="#233554" stroke-width="1"/>

    <!-- ATS Score Radial Gauge & Badge -->
    <g transform="translate(18, 16)">
      <circle cx="36" cy="36" r="30" fill="none" stroke="#1e293b" stroke-width="6"/>
      <circle cx="36" cy="36" r="30" fill="none" stroke="url(#score-grad)" stroke-width="6" stroke-dasharray="188" stroke-dashoffset="15" stroke-linecap="round"/>
      <text x="36" y="38" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">96</text>
      <text x="36" y="50" fill="#34d399" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">ATS SCORE</text>
      
      <!-- Score breakdown -->
      <text x="82" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">ATS Compatibility: 96%</text>
      <text x="82" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9">Tier: Top 4% of Candidates</text>
      <text x="82" y="54" fill="#10b981" font-family="sans-serif" font-size="8.5" font-weight="600">✓ Ready for Enterprise Screening</text>
    </g>

    <!-- Gemini Feedback Metrics Card -->
    <rect x="16" y="86" width="213" height="64" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <circle cx="28" cy="102" r="3" fill="#10b981"/>
    <text x="36" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">Action Verbs &amp; Metrics:</text>
    <text x="175" y="105" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">100%</text>

    <circle cx="28" cy="120" r="3" fill="#10b981"/>
    <text x="36" y="123" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">Target Role Keywords:</text>
    <text x="175" y="123" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">18 / 18</text>

    <circle cx="28" cy="138" r="3" fill="#38bdf8"/>
    <text x="36" y="141" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">Multi-Page PDF Layout:</text>
    <text x="175" y="141" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">OPTIMAL</text>

    <!-- Export Action Button -->
    <rect x="16" y="160" width="213" height="32" rx="6" fill="url(#btn-grad)"/>
    <text x="122" y="180" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">⚡ Download Verified ATS PDF</text>
  </g>
</svg>
