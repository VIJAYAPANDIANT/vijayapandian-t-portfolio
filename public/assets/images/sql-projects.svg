<svg width="600" height="360" viewBox="0 0 600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="360" rx="16" fill="#0c1220"/>
  <circle cx="300" cy="180" r="140" fill="url(#sql-glow)" opacity="0.18"/>
  <defs>
    <radialGradient id="sql-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 180) rotate(90) scale(140)">
      <stop stop-color="#0284c7"/>
      <stop offset="0.6" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sql-badge" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Left: SQL Query & Relational Schema Window -->
  <rect x="60" y="55" width="235" height="250" rx="10" fill="#131d33" stroke="#253754" stroke-width="1.5"/>
  <rect x="60" y="55" width="235" height="32" rx="10" fill="#0f172a"/>
  <circle cx="80" cy="71" r="4.5" fill="#ef4444"/>
  <circle cx="95" cy="71" r="4.5" fill="#f59e0b"/>
  <circle cx="110" cy="71" r="4.5" fill="#10b981"/>
  <text x="132" y="75" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">schema_analytics.sql</text>

  <!-- Database Cylinder Icon Graphic -->
  <g transform="translate(76, 96)">
    <!-- Top cylinder -->
    <ellipse cx="18" cy="12" rx="14" ry="5" fill="#38bdf8" opacity="0.9"/>
    <path d="M4 12 v12 c0 2.8 6.3 5 14 5 s14 -2.2 14 -5 v-12" fill="#0284c7" opacity="0.75"/>
    <ellipse cx="18" cy="24" rx="14" ry="5" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <path d="M4 24 v12 c0 2.8 6.3 5 14 5 s14 -2.2 14 -5 v-12" fill="#0369a1" opacity="0.85"/>
    <ellipse cx="18" cy="36" rx="14" ry="5" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <!-- Relational Label -->
    <text x="42" y="16" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Relational Schemas (3NF)</text>
    <text x="42" y="30" fill="#94a3b8" font-family="sans-serif" font-size="8.5">PostgreSQL • MySQL • SQL Server</text>
  </g>

  <!-- SQL Query Editor Preview -->
  <rect x="75" y="146" width="205" height="100" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
  <text x="85" y="166" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">WITH</text>
  <text x="114" y="166" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9">MonthlyTrend</text>
  <text x="185" y="166" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">AS (</text>
  
  <text x="95" y="182" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">SELECT</text>
  <text x="135" y="182" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">region, count(*),</text>
  
  <text x="95" y="198" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">AVG</text>
  <text x="115" y="198" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">(cases)</text>
  <text x="156" y="198" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">OVER(</text>
  <text x="188" y="198" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">PARTITION BY</text>
  
  <text x="95" y="214" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">country</text>
  <text x="140" y="214" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">ORDER BY</text>
  <text x="195" y="214" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">date)</text>

  <text x="85" y="232" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">SELECT * FROM</text>
  <text x="168" y="232" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">MonthlyTrend;</text>

  <!-- Tags under left window -->
  <rect x="75" y="258" width="62" height="20" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="0.8"/>
  <text x="106" y="272" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">Window Fn</text>

  <rect x="143" y="258" width="58" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
  <text x="172" y="272" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">CTEs</text>

  <rect x="207" y="258" width="73" height="20" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="243.5" y="272" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">ERD &amp; 3NF</text>

  <!-- Right: 4 Project Modules Hub Card -->
  <rect x="310" y="55" width="230" height="250" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  
  <!-- SQL Logo Badge -->
  <rect x="328" y="72" width="38" height="38" rx="6" fill="url(#sql-badge)"/>
  <text x="347" y="97" fill="#ffffff" font-family="'Inter', sans-serif" font-size="15" font-weight="900" text-anchor="middle">SQL</text>

  <text x="375" y="87" fill="#f8fafc" font-family="sans-serif" font-size="12.5" font-weight="bold">Enterprise SQL Suite</text>
  <text x="375" y="101" fill="#94a3b8" font-family="sans-serif" font-size="9.5">4 Relational Projects</text>

  <!-- 4 Mini Project Rows -->
  <g transform="translate(328, 118)">
    <!-- 1. Airline Reservation -->
    <rect x="0" y="0" width="195" height="32" rx="6" fill="#1f2937"/>
    <text x="10" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">✈️ Airline Reservation System</text>
    <text x="10" y="26" fill="#64748b" font-family="sans-serif" font-size="7.5">PNR, Route &amp; Seat Engine</text>

    <!-- 2. Retail Sales 3NF -->
    <rect x="0" y="36" width="195" height="32" rx="6" fill="#1f2937"/>
    <text x="10" y="51" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">🛒 Online Retail 3NF Database</text>
    <text x="10" y="62" fill="#64748b" font-family="sans-serif" font-size="7.5">E-Commerce Schema &amp; Sales Views</text>

    <!-- 3. COVID-19 Analytics -->
    <rect x="0" y="72" width="195" height="32" rx="6" fill="#1f2937"/>
    <text x="10" y="87" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="600">📊 COVID-19 Data Analytics</text>
    <text x="10" y="98" fill="#34d399" font-family="sans-serif" font-size="7.5">Live Web Dashboard • Chart.js</text>

    <!-- 4. Hospital Management -->
    <rect x="0" y="108" width="195" height="32" rx="6" fill="#1f2937"/>
    <text x="10" y="123" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">🏥 Hospital Management Database</text>
    <text x="10" y="134" fill="#64748b" font-family="sans-serif" font-size="7.5">Patient Records &amp; Medical Billing</text>
  </g>

  <!-- Bottom subtitle -->
  <text x="300" y="335" fill="#94a3b8" font-family="sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Enterprise Database Architecture • 3NF Normalization • Analytics &amp; ERD</text>
</svg>
