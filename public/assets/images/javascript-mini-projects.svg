  <circle cx="85" cy="71" r="4.5" fill="#ef4444"/>
  <circle cx="100" cy="71" r="4.5" fill="#f59e0b"/>
  <circle cx="115" cy="71" r="4.5" fill="#10b981"/>
  <text x="140" y="75" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">mini-projects.js</text>

  <!-- Weather App Mini Card -->
  <rect x="80" y="100" width="195" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
