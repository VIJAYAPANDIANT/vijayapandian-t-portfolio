  <text x="92" y="134" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Open-Meteo API • Real-Time</text>
  <rect x="220" y="110" width="45" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
  <text x="242" y="124" fill="#38bdf8" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">24°C</text>

  <!-- Stopwatch Mini Card -->
  <rect x="80" y="150" width="195" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="92" y="172" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Precision Stopwatch</text>
  <text x="92" y="184" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">00:14:28.450</text>
  <circle cx="245" cy="171" r="8" fill="#10b981" opacity="0.2"/>
  <circle cx="245" cy="171" r="4" fill="#10b981"/>

  <!-- Calculator Mini Card -->
  <rect x="80" y="200" width="195" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
