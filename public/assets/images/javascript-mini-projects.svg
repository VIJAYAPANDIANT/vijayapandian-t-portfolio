<svg width="600" height="360" viewBox="0 0 600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="360" rx="16" fill="#0c1220"/>
  <circle cx="300" cy="180" r="140" fill="url(#js-glow)" opacity="0.18"/>
  <defs>
    <radialGradient id="js-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 180) rotate(90) scale(140)">
      <stop stop-color="#f59e0b"/>
      <stop offset="0.6" stop-color="#eab308" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="js-badge" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#facc15"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Left: Mini App Suite Preview Window -->
  <rect x="65" y="55" width="225" height="250" rx="10" fill="#131d33" stroke="#253754" stroke-width="1.5"/>
