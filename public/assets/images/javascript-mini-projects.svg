  <text x="92" y="234" fill="#94a3b8" font-family="sans-serif" font-size="8.5">CSS Grid • Arithmetic Engine</text>
  <text x="248" y="226" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">+/-</text>

  <!-- Tech tags inside window -->
  <rect x="80" y="254" width="60" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="110" y="266" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">DOM API</text>

  <rect x="146" y="254" width="64" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="178" y="266" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">Async/Await</text>

  <rect x="216" y="254" width="59" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
  <text x="245.5" y="266" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">13 Apps</text>

  <!-- Right: Featured Hub Card -->
  <rect x="310" y="55" width="225" height="250" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  
  <!-- JS Logo Badge -->
  <rect x="330" y="78" width="40" height="40" rx="6" fill="url(#js-badge)"/>
  <text x="350" y="105" fill="#000000" font-family="'Inter', sans-serif" font-size="20" font-weight="900" text-anchor="middle">JS</text>

  <text x="382" y="94" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Vanilla JS Suite</text>
  <text x="382" y="109" fill="#94a3b8" font-family="sans-serif" font-size="10">13 Interactive Projects</text>

  <!-- Metric Badges -->
  <rect x="330" y="132" width="185" height="34" rx="6" fill="#1f2937"/>
  <text x="342" y="148" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">Zero Dependencies</text>
  <text x="342" y="159" fill="#64748b" font-family="sans-serif" font-size="8">Pure HTML5, CSS3 &amp; ES6+</text>

  <rect x="330" y="174" width="185" height="34" rx="6" fill="#1f2937"/>
  <text x="342" y="190" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">API Integration</text>
  <text x="342" y="201" fill="#64748b" font-family="sans-serif" font-size="8">Open-Meteo Weather API</text>

  <rect x="330" y="216" width="185" height="34" rx="6" fill="#1f2937"/>
  <text x="342" y="232" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">UI / UX Design</text>
  <text x="342" y="243" fill="#64748b" font-family="sans-serif" font-size="8">Glassmorphism, Flexbox, Grid</text>

  <!-- GitHub Button -->
  <rect x="330" y="260" width="185" height="28" rx="6" fill="#f59e0b"/>
  <text x="422.5" y="278" fill="#000000" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">View 13 Mini Projects →</text>

  <text x="300" y="335" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">JavaScript Mini Projects Collection • Vanilla JS • HTML5 • CSS3</text>
